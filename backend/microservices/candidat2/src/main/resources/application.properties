spring.application.name=candidat
server.port=8087
#H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
#DataSource
spring.datasource.username=Badia
spring.datasource.password=
#spring.datasource.url=jdbc:h2:file:./Database/Data/Candidat
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# ==================================
# Spring Boot Actuator
# ==================================

# Exposer les endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Afficher les détails de santé
management.endpoint.health.show-details=always

# Transmettre l'état de santé à Eureka
eureka.client.healthcheck.enabled=true

# Activer les informations personnalisées
management.info.env.enabled=true

# Informations du microservice
info.app.name=candidat
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidats
info.app.team=JobBoard

