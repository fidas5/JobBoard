spring.application.name=gateway
server.port=5085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# DYNAMIC ROUTING - CANDIDAT
spring.cloud.gateway.server.webflux.routes[0].id=candidat
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CANDIDAT
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/candidates,/candidates/**

# DYNAMIC ROUTING - CANDITATURE
spring.cloud.gateway.server.webflux.routes[1].id=candidature
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CANDITATURE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/candidature,/candidature/**


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

